<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Chronicle：你的 Mac 记得你的每一天。">
  <title>Chronicle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231F1F21'/%3E%3Crect x='19.5' y='13' width='3' height='38' rx='1.5' fill='%23FF9F0A'/%3E%3Crect x='24' y='20' width='23' height='2.4' rx='1.2' fill='%23fff'/%3E%3Crect x='24' y='31' width='23' height='2.4' rx='1.2' fill='%23fff'/%3E%3Crect x='24' y='43' width='23' height='2.4' rx='1.2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="bar" id="bar">
    <a class="brand" href="/" data-nav="day" aria-label="Chronicle 时间线">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6.2" y="3.5" width="2.2" height="17" rx="1.1" fill="#FF9F0A"/>
        <rect x="10.4" y="6.6" width="8.6" height="1.9" rx=".95"/>
        <rect x="10.4" y="11.05" width="8.6" height="1.9" rx=".95"/>
        <rect x="10.4" y="15.5" width="8.6" height="1.9" rx=".95"/>
      </svg>
      <span>Chronicle</span>
    </a>

    <nav class="tabs" aria-label="主要页面">
      <a href="/" data-nav="day">时间线</a>
      <a href="/?view=memory" data-nav="memory">记忆</a>
    </nav>

    <div class="bar-actions">
      <button class="search-btn" type="button" data-action="search-open" aria-label="搜索（⌘K）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="m12.8 12.8 4.2 4.2"/></svg>
        <span>搜索</span>
        <kbd>⌘K</kbd>
      </button>
      <button class="status" type="button" id="status" data-action="status-open" aria-haspopup="dialog" aria-expanded="false">
        <i class="status-dot" aria-hidden="true"></i>
        <span class="status-text">正在连接…</span>
      </button>
      <a class="icon-btn" href="/?view=settings" data-nav="settings" aria-label="设置">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M4.8 15.2l1.4-1.4M13.8 6.2l1.4-1.4"/></svg>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1" aria-live="polite" aria-busy="true"></main>

  <div id="layer"></div>
  <div class="toast-zone" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
